name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947

      - name: Verify release tag
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build sherpa-onnx without text-to-speech
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          cmake="$ANDROID_HOME/cmake/3.31.6"
          test -d "$ndk" || "$sdkmanager" --install "ndk;29.0.14206865"
          test -d "$cmake" || "$sdkmanager" --install "cmake;3.31.6"
          export PATH="$cmake/bin:$PATH"
          set -o pipefail
          log="$RUNNER_TEMP/sherpa-onnx-build.log"
          ANDROID_NDK_HOME="$ndk" tools/build-sherpa-onnx-no-tts.sh app/libs/sherpa-onnx-1.13.3-no-tts.aar | tee "$log"
          if ! grep -q "the AAR matches the recorded build" "$log"; then
            echo "::warning title=sherpa-onnx AAR::The AAR built in this run differs from the recorded build. Compare the hashes in this step's log before relying on the release."
          fi

      - name: Assert the development source set is absent
        run: test ! -e app/src/dev

      - name: Configure product build
        env:
          ANONEN_CLOUD_URL: ${{ vars.ANONEN_CLOUD_URL || 'https://api.anonen.net' }}
          ANONEN_SUPABASE_URL: ${{ vars.ANONEN_SUPABASE_URL }}
          ANONEN_SUPABASE_ANON_KEY: ${{ vars.ANONEN_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANONEN_SUPABASE_URL"
          test -n "$ANONEN_SUPABASE_ANON_KEY"
          case "$ANONEN_CLOUD_URL" in https://*) ;; *) echo "ANONEN_CLOUD_URL must be https"; exit 1;; esac
          case "$ANONEN_SUPABASE_URL" in https://*) ;; *) echo "ANONEN_SUPABASE_URL must be https"; exit 1;; esac
          test ! -e keystore.properties
          printf '%s\n' \
            "ANONEN_EDITION=product" \
            "ANONEN_CLOUD_URL=$ANONEN_CLOUD_URL" \
            "ANONEN_SUPABASE_URL=$ANONEN_SUPABASE_URL" \
            "ANONEN_SUPABASE_ANON_KEY=$ANONEN_SUPABASE_ANON_KEY" \
            "ANONEN_SEALED_REQUIRED=true" > .env

      - name: Verify the gateway can seal
        env:
          ANONEN_CLOUD_URL: ${{ vars.ANONEN_CLOUD_URL || 'https://api.anonen.net' }}
        run: |
          accepted="$(grep -v '^[[:space:]]*#' accepted-digests.txt | tr -d ' \t\r' | grep -v '^$' | paste -sd, -)"
          test -n "$accepted" || { echo "accepted-digests.txt lists no digest"; exit 1; }

          url="$ANONEN_CLOUD_URL/v1/attestation?nonce=aaaaaaaaaaaaaaaa"
          code="$(curl -sS -o response.json -w '%{http_code}' --max-time 30 "$url")"
          test "$code" = "200" || { echo "ANONEN_CLOUD_URL cannot seal: HTTP $code"; exit 1; }

          payload="$(jq -r .token response.json | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#payload} % 4 )) in 2) payload="$payload==" ;; 3) payload="$payload=" ;; esac
          running="$(printf '%s' "$payload" | base64 -d | jq -r .submods.container.image_digest)"
          case ",$accepted," in
            *",$running,"*) echo "running image is accepted: $running" ;;
            *) echo "running image $running is not in accepted-digests.txt"; exit 1 ;;
          esac

      - name: Test and build release packages
        run: ./gradlew --no-daemon test bundleRelease assembleRelease

      - name: Assert sealed audio is required in the built config
        run: |
          f="$(find app/build/generated/source/buildConfig/release -name BuildConfig.java)"
          test -n "$f"
          grep -q 'SEALED_REQUIRED = true' "$f"
          grep -q 'ANONEN_SUPABASE_URL = "https://' "$f"
          grep -q 'ANONEN_CLOUD_URL = "https://' "$f"
          grep -q 'ANONEN_ACCEPTED_IMAGE_DIGESTS = "sha256:' "$f"

      - name: Assert the notices are inside the APK
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q ' assets/NOTICE.md$'
          unzip -l "$apk" | grep -q ' assets/THIRD-PARTY-NOTICES.md$'

      - name: Collect unsigned packages
        run: |
          bt="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$bt/zipalign" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"
          mkdir unsigned
          "$bt/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app-release.apk
          "$bt/zipalign" -c -P 16 4 unsigned/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned/app-release.aab

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned
          path: unsigned/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned
          path: unsigned/

      - name: Sign the packages
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$bt/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          mkdir signed
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --alignment-preserved --v1-signing-enabled false --v4-signing-enabled false \
            --out signed/app-release.apk unsigned/app-release.apk
          "$bt/apksigner" verify --print-certs signed/app-release.apk
          cp unsigned/app-release.aab signed/app-release.aab
          jarsigner="${JAVA_HOME:?}/bin/jarsigner"
          "$jarsigner" -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            signed/app-release.aab "$ANDROID_KEY_ALIAS"
          "$jarsigner" -verify signed/app-release.aab > "$RUNNER_TEMP/verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/verify.txt"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed
          path: signed/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed
          path: release/

      - name: Checksums
        run: |
          cd release
          sha256sum ./*.aab ./*.apk > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            release/*.aab
            release/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
          --title "Release $GITHUB_REF_NAME" --notes "Verified release build."
